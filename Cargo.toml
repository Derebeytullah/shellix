[package]
name = "shellix"
version = "0.1.0"
edition = "2024"

[dependencies]
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures-util = "0.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
lazy_static = "1.4"
russh = "0.40"
russh-keys = "0.40"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
aes-gcm = "0.10"
pbkdf2 = "0.12"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
dirs = "6"